name: build-mac
on:
  workflow_dispatch:
  push:
    paths: [sitter_fi.py, build_mac.sh, assets/**, .github/workflows/build-mac.yml]

permissions:
  contents: read

jobs:
  mac-arm64:
    runs-on: macos-14  # Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python test_sitter.py
      - run: PY=python bash build_mac.sh
      - name: launch the app and check it stays up
        run: |
          APP=dist-mac/EtherDream-Sitter-FI.app/Contents/MacOS/EtherDream-Sitter-FI
          "$APP" & PID=$!
          sleep 15
          LOG=~/Library/Logs/EtherDreamSitterFI/erro.log
          [ -f "$LOG" ] && cat "$LOG"
          kill -0 $PID && [ ! -s "$LOG" ] && echo "app running, no errors"
          screencapture -x shot.png || true
          kill $PID
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: EtherDream-Sitter-FI-mac-arm64
          path: dist-mac/EtherDream-Sitter-FI-mac-arm64.zip
